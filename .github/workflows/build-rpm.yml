name: Linux packages
on:
  push:
    branches: [build]
  workflow_dispatch:
  pull_request:
    branches: [build]
permissions:
  contents: read
concurrency:
  group: lockttyui-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rpm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        el: [9, 10]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build RPM on AlmaLinux ${{ matrix.el }}
        run: |
          mkdir -p dist
          docker run --rm -e BUILD_RELEASE="$GITHUB_RUN_NUMBER" -v "$PWD:/src:ro" -v "$PWD/dist:/out" almalinux:${{ matrix.el }} bash -euxc '
            dnf -y install golang rpm-build systemd-rpm-macros binutils git
            export HOME=/root
            mkdir -p /root/rpmbuild/{SOURCES,SPECS}
            version=$(awk "/^Version:/{print \$2}" /src/packaging/lockttyui.spec)
            cp /src/packaging/lockttyui.spec /root/rpmbuild/SPECS/
            git -c safe.directory=/src -C /src archive --format=tar.gz --prefix="lockttyui-$version/" HEAD > "/root/rpmbuild/SOURCES/lockttyui-$version.tar.gz"
            rpmbuild -bb --define "build_release $BUILD_RELEASE" /root/rpmbuild/SPECS/lockttyui.spec
            find /root/rpmbuild/RPMS -name "lockttyui-*.rpm" ! -name "*debuginfo*" ! -name "*debugsource*" -exec cp {} /out/ \;
          '
      - name: Release installer syntax and help checks
        run: |
          bash -n scripts/install.sh
          bash scripts/install.sh --help | grep -Fq "Install/update"

      - name: Fetch known previous RPM for upgrade regression
        run: |
          mkdir -p previous
          if [ "${{ matrix.el }}" = 9 ]; then
            curl -fL --retry 3 -o previous/lockttyui-0.6.0-15.el9.x86_64.rpm https://github.com/ARTS-Night/LockTTYUI/releases/download/build-15/lockttyui-0.6.0-15.el9.x86_64.rpm
          echo "e3bbba164fa38ae31c9543951c712455a79f84d06162539c417e4fcaa77b2426  previous/lockttyui-0.6.0-15.el9.x86_64.rpm" | sha256sum -c -
          fi
      - name: Clean DNF install, reinstall, upgrade and removal test
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" -v "$PWD/previous:/previous:ro" -v "$PWD:/src:ro" almalinux:${{ matrix.el }} bash -euxc '
            dnf -y install systemd /usr/sbin/agetty python3
            # AlmaLinux 9 contains curl-minimal; installing full curl conflicts.
            command -v curl
            bash -n /src/scripts/install.sh
            bash /src/scripts/install.sh --help | grep -Fq "Install/update"
            stock_getty=$(sha256sum /usr/lib/systemd/system/getty@.service | cut -d" " -f1)
            dnf -y --nogpgcheck --setopt=install_weak_deps=False install /packages/lockttyui-*.rpm
            rpm -q lockttyui
            rpm -qR lockttyui
            rpm -ql lockttyui
            test -f /usr/lib/systemd/system/lockttyui-preview.service
            test -f /usr/lib/systemd/system/getty@tty1.service.d/50-lockttyui.conf
            # The stock agetty MUST run as systemd ExecStart, not from LockTTYUI.
            ! grep -q "^ExecStart=" /usr/lib/systemd/system/getty@tty1.service.d/50-lockttyui.conf
            grep -Fxq "Restart=no" /usr/lib/systemd/system/getty@tty1.service.d/50-lockttyui.conf
            grep -Fxq "OnSuccess=lockttyui-tty1-return.service" /usr/lib/systemd/system/getty@tty1.service.d/50-lockttyui.conf
            grep -Fxq "OnFailure=lockttyui-tty1-return.service" /usr/lib/systemd/system/getty@tty1.service.d/50-lockttyui.conf
            grep -Fxq "ConditionPathExists=/run/lockttyui-tty1-login.ready" /usr/lib/systemd/system/getty@tty1.service.d/50-lockttyui.conf
            test -f /usr/lib/systemd/system/lockttyui-tty1.service
            test -f /usr/lib/systemd/system/lockttyui-tty1-handoff.service
            test -L /usr/lib/systemd/system/getty.target.wants/lockttyui-tty1.service
            grep -Fxq "User=nobody" /usr/lib/systemd/system/lockttyui-tty1.service
            grep -Fxq "OnSuccess=lockttyui-tty1-handoff.service" /usr/lib/systemd/system/lockttyui-tty1.service
            grep -Fxq "ExecStart=/usr/libexec/lockttyui-tty1-route handoff" /usr/lib/systemd/system/lockttyui-tty1-handoff.service
            grep -Fxq "OnFailure=lockttyui-tty1-fallback.service" /usr/lib/systemd/system/lockttyui-tty1.service
            grep -Fxq "StandardInput=tty-fail" /usr/lib/systemd/system/lockttyui-tty1.service
            grep -Fxq "TTYVHangup=no" /usr/lib/systemd/system/lockttyui-tty1.service
            test -x /usr/libexec/lockttyui-tty1-route
            sh -n /usr/libexec/lockttyui-tty1-route
            test -f /usr/lib/systemd/system/lockttyui-tty1-return.service
            test -f /usr/lib/systemd/system/lockttyui-tty1-fallback.service
            test ! -e /usr/lib/systemd/system/getty@tty2.service.d/50-lockttyui.conf
            test ! -e /etc/systemd/system/getty@tty1.service.d/50-lockttyui.conf
            test "$(sha256sum /usr/lib/systemd/system/getty@.service | cut -d" " -f1)" = "$stock_getty"
            # Container images omit man pages; check unit syntax without Documentation= lookup.
            systemd-analyze --man=no verify getty@tty1.service lockttyui-tty1.service lockttyui-tty1-handoff.service lockttyui-tty1-return.service lockttyui-tty1-fallback.service
            # is-enabled returns success for static units on EL9; assert the actual state.
            preview_state=$(systemctl is-enabled lockttyui-preview.service 2>/dev/null || :)
            case "$preview_state" in static|disabled) ;; *) echo "Unexpected preview unit state: $preview_state"; exit 1;; esac
            test ! -e /etc/systemd/system/multi-user.target.wants/lockttyui-preview.service
            test ! -e /etc/systemd/system/getty.target.wants/lockttyui-preview.service
            if rpm -q golang; then exit 1; fi
            /usr/bin/lockttyui --glyph-test
            # Reinstall exercises RPM lifecycle scripts without starting/stopping
            # a live getty (the container has no running systemd manager).
            dnf -y --nogpgcheck reinstall /packages/lockttyui-*.rpm
            rpm -V lockttyui
            test -f /usr/lib/systemd/system/getty@tty1.service.d/50-lockttyui.conf
            dnf -y remove lockttyui
            test ! -e /usr/bin/lockttyui
            test ! -e /usr/lib/systemd/system/getty@tty1.service.d/50-lockttyui.conf
            test ! -e /usr/lib/systemd/system/lockttyui-tty1.service
            test ! -e /usr/lib/systemd/system/lockttyui-tty1-handoff.service
            test ! -e /usr/lib/systemd/system/lockttyui-tty1-return.service
            test ! -e /usr/lib/systemd/system/lockttyui-tty1-fallback.service
            test ! -e /usr/libexec/lockttyui-tty1-route
            test ! -e /usr/lib/systemd/system/getty.target.wants/lockttyui-tty1.service
            test -f /usr/lib/systemd/system/getty@.service
            # Exercise a real upgrade transaction from the validated build-15.
            if compgen -G "/previous/*.rpm" >/dev/null; then
            dnf -y --nogpgcheck --setopt=install_weak_deps=False install /previous/*.rpm
            dnf -y --nogpgcheck upgrade /packages/lockttyui-*.rpm
            expected=$(rpm -qp --qf "%{VERSION}-%{RELEASE}" /packages/lockttyui-*.rpm)
            test "$(rpm -q --qf "%{VERSION}-%{RELEASE}" lockttyui)" = "$expected"
            rpm -V lockttyui
            test -x /usr/libexec/lockttyui-tty1-route
            systemd-analyze --man=no verify getty@tty1.service lockttyui-tty1.service lockttyui-tty1-handoff.service lockttyui-tty1-return.service lockttyui-tty1-fallback.service
            dnf -y remove lockttyui
            test ! -e /usr/bin/lockttyui
            test ! -e /usr/libexec/lockttyui-tty1-route
            test ! -e /usr/lib/systemd/system/getty@tty1.service.d/50-lockttyui.conf
            test "$(sha256sum /usr/lib/systemd/system/getty@.service | cut -d" " -f1)" = "$stock_getty"
            fi
          '
      - name: Verify static ELF and checksums
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" almalinux:${{ matrix.el }} bash -euxc '
            dnf -y install binutils cpio
            mkdir /tmp/check
            cd /tmp/check
            rpm2cpio /packages/lockttyui-*.rpm | cpio -id
            readelf -h usr/bin/lockttyui
            if readelf -l usr/bin/lockttyui | grep -q INTERP; then exit 1; fi
            if readelf -d usr/bin/lockttyui | grep -q NEEDED; then exit 1; fi
          '
          cd dist
          sha256sum *.rpm > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: lockttyui-el${{ matrix.el }}-x86_64
          path: dist/*.rpm
          if-no-files-found: error
          retention-days: 14

  deb:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        version: [12, 13]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Build and test shared Go code
        env:
          CGO_ENABLED: '0'
          GOAMD64: v1
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOTOOLCHAIN: local
        run: |
          go test -mod=readonly ./...
          go vet -mod=readonly ./...
          go build -mod=readonly -trimpath -ldflags="-s -w" -o lockttyui .
      - name: Build DEB
        run: |
          mkdir -p dist
          bash packaging/build-deb.sh "${{ matrix.version }}" "$GITHUB_RUN_NUMBER" "$PWD/lockttyui" "$PWD/dist"
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          readelf -h lockttyui
          if readelf -l lockttyui | grep -q INTERP; then exit 1; fi
          if readelf -d lockttyui | grep -q NEEDED; then exit 1; fi
      - name: APT install, reinstall, remove and purge
        run: |
          docker run --rm -v "$PWD/dist:/packages:ro" -v "$PWD/packaging:/packaging:ro" "debian:${{ matrix.version }}" bash -euxc 'bash /packaging/test-deb.sh'
      - uses: actions/upload-artifact@v4
        with:
          name: lockttyui-deb${{ matrix.version }}-amd64
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/build'
    needs: [rpm, deb]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: lockttyui-*
          path: dist
          merge-multiple: true
      - name: Publish all four unsigned packages after successful checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          test "$(find . -maxdepth 1 -name '*.rpm' | wc -l)" -eq 2
          test "$(find . -maxdepth 1 -name '*.deb' | wc -l)" -eq 2
          sha256sum *.rpm *.deb > SHA256SUMS
          sha256sum -c SHA256SUMS
          cd ..
          tag="build-${GITHUB_RUN_NUMBER}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$tag" dist/*.rpm dist/*.deb dist/SHA256SUMS --target "$GITHUB_SHA" --title "LockTTYUI build ${GITHUB_RUN_NUMBER}" --notes "UNSIGNED test packages for AlmaLinux 9/10 x86_64 and Debian 12/13 amd64. Select the matching OS package and verify its SHA-256. Container package tests do not establish live TTY, PAM or SELinux/AppArmor behavior. Use an SSH/TTY2 recovery path and test in a VM." --prerelease
