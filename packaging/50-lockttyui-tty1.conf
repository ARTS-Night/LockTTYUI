# Vendor-only override of the tty1 instance; tty2+, SSH, PAM and getty@.service stay unchanged.
# The bridge restores the normal agetty prompt on Ctrl+] or dashboard failure.
# Existing login sessions are not interrupted by RPM installation or removal.
[Service]
ExecStart=
ExecStart=-/usr/bin/lockttyui --tty1-bridge
TTYPath=/dev/tty1
StandardInput=tty
StandardOutput=tty
Restart=always
RestartSec=1s
