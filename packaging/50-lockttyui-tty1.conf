# TTY1 only: preserve stock agetty ExecStart, PAM and SELinux transitions.
# Keep the lease until the router observes a clean exit.
[Unit]
ConditionPathExists=/run/lockttyui-tty1-login.ready
OnSuccess=lockttyui-tty1-return.service
OnFailure=lockttyui-tty1-return.service
StartLimitIntervalSec=20s
StartLimitBurst=10

[Service]
# Classify raw exit status in the return router; the vendor ExecStart prefix
# "-" can otherwise cause failures to be reported as successful stops.
Restart=no
