# TTY1 only: preserve the stock agetty ExecStart, PAM and SELinux transition.
# The root-owned token stays present for the entire login service lifetime,
# including automatic retry after a failure. Only the return router removes it.
[Unit]
ConditionPathExists=/run/lockttyui-tty1-login.ready
OnSuccess=lockttyui-tty1-return.service
StartLimitIntervalSec=20s
StartLimitBurst=10

[Service]
# A successful logout returns to the dashboard; a failing getty retries the
# stock login instead of bouncing between two failed processes.
Restart=on-failure
RestartSec=3s
