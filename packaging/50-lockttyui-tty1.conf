# TTY1 only. Always run the stock /usr/sbin/agetty as the main command,
# launched by systemd itself so the standard SELinux getty_t transition applies.
# tty2+, PAM, SSH and the distribution's getty@.service remain untouched.
[Unit]
ConditionPathExists=/run/lockttyui-tty1-login.ready
OnSuccess=lockttyui-tty1.service
OnFailure=lockttyui-tty1.service
StartLimitIntervalSec=20s
StartLimitBurst=10

[Service]
# Do not automatically respawn agetty; its logout must return to the dashboard.
Restart=no
# Consume the one-shot handoff token AFTER the condition has passed.
ExecStartPre=-/usr/bin/rm -f /run/lockttyui-tty1-login.ready
